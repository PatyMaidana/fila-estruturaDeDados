services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
    - "3000:3000"

    volumes:
    - ./src:/app/src

    environment:
    - NODE_ENV=development

  
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile

    
    ports:
      - "5173:5173"

    volumes:
      - ./front/src:/app/src

    depends_on:
    - backend